version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile-php
    container_name: php_container
    volumes:
      - ./:/var/www/html
    env_file:
      - .env.local
      - .env.test.local
    depends_on:
      - db
      - test_db


  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: postgres:latest
    container_name: db_container
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_IN}:${DB_PORT}"
    volumes:
      - db_data:/var/lib/postgresql/data
  test_db:
    image: postgres:latest
    container_name: db_test_container
    env_file:
      - .env.test.local
    environment:
      POSTGRES_DB: ${DB_TEST_NAME}
      POSTGRES_USER: ${DB_TEST_USER}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD}
    ports:
      - "${DB_TEST_PORT_IN}:${DB_TEST_PORT}"
    volumes:
      - test_db_data:/var/lib/postgresql/data


volumes:
  db_data:
  test_db_data:

